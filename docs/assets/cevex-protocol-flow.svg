<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">CEVEX protocol flow</title>
  <desc id="desc">A centered CEVEX authorization workflow with shadcn-style tabs, command bar, workflow cards, and evidence cards.</desc>
  <defs>
    <linearGradient id="pageFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020409"/>
      <stop offset="52%" stop-color="#061327"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="surfaceFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08172f"/>
      <stop offset="100%" stop-color="#040914"/>
    </linearGradient>
    <linearGradient id="activeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2f83"/>
      <stop offset="100%" stop-color="#06142a"/>
    </linearGradient>
    <linearGradient id="flowLine" x1="216" y1="0" x2="1224" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052ff"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#2f80ff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-18%" y="-22%" width="136%" height="144%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".42"/>
    </filter>
    <style>
      svg {
        background: #020409;
        font-family: "Aptos", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      }

      .mono {
        font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      }

      .logo-text {
        fill: #f8fbff;
        font-size: 24px;
        font-weight: 760;
      }

      .kicker {
        fill: #8ecbff;
        font-size: 13px;
        font-weight: 760;
      }

      .title {
        fill: #f8fbff;
        font-size: 50px;
        font-weight: 780;
      }

      .subtitle {
        fill: #b9d5ef;
        font-size: 19px;
        font-weight: 540;
      }

      .panel {
        fill: rgba(2, 7, 18, .74);
        stroke: rgba(125, 211, 252, .22);
        stroke-width: 1;
      }

      .tab {
        fill: rgba(8, 23, 47, .72);
        stroke: rgba(125, 211, 252, .22);
        stroke-width: 1;
      }

      .tab-active {
        animation: tabPulse 10s cubic-bezier(.4, 0, .2, 1) infinite;
      }

      .tab-text {
        fill: #dcecff;
        font-size: 14px;
        font-weight: 720;
      }

      .command {
        fill: rgba(2, 7, 18, .86);
        stroke: rgba(125, 211, 252, .28);
        stroke-width: 1;
        filter: url(#shadow);
      }

      .command-icon {
        fill: rgba(0, 82, 255, .22);
        stroke: rgba(125, 211, 252, .48);
        stroke-width: 1;
      }

      .cmd-text {
        fill: #dcecff;
        font-size: 16px;
        font-weight: 640;
      }

      .cmd-muted {
        fill: #83a6c8;
        font-size: 14px;
        font-weight: 560;
      }

      .card {
        fill: url(#surfaceFill);
        stroke: rgba(125, 211, 252, .31);
        stroke-width: 1.1;
        filter: url(#shadow);
        animation: cardPulse 10s cubic-bezier(.4, 0, .2, 1) infinite;
      }

      .card-final {
        fill: url(#activeFill);
      }

      .icon-ring {
        fill: rgba(0, 82, 255, .18);
        stroke: rgba(125, 211, 252, .46);
        stroke-width: 1.2;
      }

      .icon {
        fill: none;
        stroke: #a8d7ff;
        stroke-width: 2.3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .icon-ok {
        stroke: #5eead4;
      }

      .stage-num {
        fill: #2f80ff;
        font-size: 12px;
        font-weight: 820;
      }

      .stage-title {
        fill: #f8fbff;
        font-size: 20px;
        font-weight: 760;
      }

      .stage-body {
        fill: #abc9e8;
        font-size: 14px;
        font-weight: 560;
      }

      .stage-code {
        fill: #dcecff;
        font-size: 12.5px;
        font-weight: 640;
      }

      .rail {
        fill: none;
        stroke: rgba(125, 211, 252, .16);
        stroke-width: 4;
        stroke-linecap: round;
      }

      .rail-live {
        fill: none;
        stroke: url(#flowLine);
        stroke-width: 4;
        stroke-linecap: round;
        stroke-dasharray: 118 1010;
        animation: railFlow 10s linear infinite;
      }

      .flow-dot {
        fill: #5eead4;
      }

      .evidence-card {
        fill: rgba(3, 11, 24, .82);
        stroke: rgba(125, 211, 252, .24);
        stroke-width: 1;
        filter: url(#shadow);
      }

      .evidence-label {
        fill: #83a6c8;
        font-size: 12px;
        font-weight: 780;
      }

      .evidence-title {
        fill: #f8fbff;
        font-size: 18px;
        font-weight: 760;
      }

      .evidence-value {
        fill: #dcecff;
        font-size: 13px;
        font-weight: 640;
      }

      .ok {
        fill: #5eead4;
      }

      .stage-1 { animation-delay: 0s; }
      .stage-2 { animation-delay: 2s; }
      .stage-3 { animation-delay: 4s; }
      .stage-4 { animation-delay: 6s; }
      .stage-5 { animation-delay: 8s; }

      @keyframes cardPulse {
        0%, 18%, 100% {
          stroke: rgba(125, 211, 252, .31);
        }
        7%, 13% {
          stroke: rgba(94, 234, 212, .9);
        }
      }

      @keyframes tabPulse {
        0%, 18%, 100% {
          fill: rgba(8, 23, 47, .72);
          stroke: rgba(125, 211, 252, .22);
        }
        7%, 13% {
          fill: rgba(0, 82, 255, .22);
          stroke: rgba(94, 234, 212, .62);
        }
      }

      @keyframes railFlow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -1128; }
      }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#pageFill)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>

  <g transform="translate(72 52)">
    <circle cx="30" cy="30" r="30" fill="#0052ff"/>
    <path d="M21 17h21v8H30v9h12v8H21z" fill="#ffffff"/>
    <path d="M35 24l8 9-8 9" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="square"/>
    <text class="logo-text" x="78" y="39">CEVEX</text>
  </g>

  <g transform="translate(1046 56)">
    <rect x="0" y="0" width="322" height="54" rx="27" class="panel"/>
    <text x="28" y="34" fill="#b9d5ef" font-size="14" font-weight="650">Base Sepolia registry</text>
    <circle cx="270" cy="27" r="7" fill="#5eead4"/>
    <text x="288" y="33" fill="#f8fbff" font-size="14" font-weight="760">Live</text>
  </g>

  <g text-anchor="middle">
    <text class="kicker" x="720" y="148">POST-QUANTUM AGENT AUTHORIZATION</text>
    <text class="title" x="720" y="210">Verify the action before execution</text>
    <text class="subtitle" x="720" y="248">Intent, proof, registry, and transaction values are checked in one controlled path.</text>
  </g>

  <g transform="translate(270 286)">
    <rect x="0" y="0" width="900" height="56" rx="18" class="panel"/>
    <rect x="10" y="9" width="168" height="38" rx="12" class="tab tab-active stage-1"/>
    <rect x="188" y="9" width="168" height="38" rx="12" class="tab tab-active stage-2"/>
    <rect x="366" y="9" width="168" height="38" rx="12" class="tab tab-active stage-3"/>
    <rect x="544" y="9" width="168" height="38" rx="12" class="tab tab-active stage-4"/>
    <rect x="722" y="9" width="168" height="38" rx="12" class="tab tab-active stage-5"/>
    <text class="tab-text" x="94" y="33" text-anchor="middle">Intent</text>
    <text class="tab-text" x="272" y="33" text-anchor="middle">Proof</text>
    <text class="tab-text" x="450" y="33" text-anchor="middle">Registry</text>
    <text class="tab-text" x="628" y="33" text-anchor="middle">Verify</text>
    <text class="tab-text" x="806" y="33" text-anchor="middle">Execute</text>
  </g>

  <g transform="translate(270 364)">
    <rect x="0" y="0" width="900" height="64" rx="22" class="command"/>
    <circle class="command-icon" cx="34" cy="32" r="17"/>
    <path class="icon" d="M27 27l7 6-7 6M39 39h8" stroke-width="2"/>
    <text class="cmd-text mono" x="70" y="39">cevex verify --intent signed-transfer.json --registry base</text>
    <rect x="778" y="18" width="104" height="28" rx="14" fill="rgba(94,234,212,.11)" stroke="rgba(94,234,212,.42)"/>
    <text x="830" y="37" text-anchor="middle" fill="#bafff1" font-size="13" font-weight="760">ready</text>
  </g>

  <g transform="translate(72 462)">
    <rect x="0" y="0" width="1296" height="246" rx="30" class="panel"/>
    <path class="rail" d="M144 85H1152"/>
    <path class="rail-live" d="M144 85H1152"/>
    <circle class="flow-dot" r="6">
      <animateMotion dur="10s" repeatCount="indefinite" path="M144 85 H1152"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle class="flow-dot" r="4" fill="#7dd3fc">
      <animateMotion dur="10s" begin="1s" repeatCount="indefinite" path="M144 85 H1152"/>
      <animate attributeName="opacity" values="0;0.72;0.72;0" keyTimes="0;0.08;0.92;1" dur="10s" begin="1s" repeatCount="indefinite"/>
    </circle>

    <g transform="translate(46 34)">
      <rect x="0" y="0" width="196" height="176" rx="22" class="card stage-1"/>
      <circle class="icon-ring" cx="38" cy="38" r="21"/>
      <path class="icon" d="M28 38h20M38 28v20"/>
      <text class="stage-num" x="26" y="80">01</text>
      <text class="stage-title" x="26" y="112">Intent</text>
      <text class="stage-body" x="26" y="140">Fix action values</text>
      <text class="stage-code mono" x="26" y="162">amount + receiver</text>
    </g>

    <g transform="translate(298 34)">
      <rect x="0" y="0" width="196" height="176" rx="22" class="card stage-2"/>
      <circle class="icon-ring" cx="38" cy="38" r="21"/>
      <path class="icon" d="M27 44c4-18 26-18 30 0M34 44v11M50 44v11"/>
      <text class="stage-num" x="26" y="80">02</text>
      <text class="stage-title" x="26" y="112">ML-DSA</text>
      <text class="stage-body" x="26" y="140">Authorize intent</text>
      <text class="stage-code mono" x="26" y="162">sig 0x8be5...045d</text>
    </g>

    <g transform="translate(550 34)">
      <rect x="0" y="0" width="196" height="176" rx="22" class="card stage-3"/>
      <circle class="icon-ring" cx="38" cy="38" r="21"/>
      <path class="icon" d="M28 33c0-8 20-8 20 0v22c0 8-20 8-20 0zM28 33c0 8 20 8 20 0M28 44c0 8 20 8 20 0"/>
      <text class="stage-num" x="26" y="80">03</text>
      <text class="stage-title" x="26" y="112">Registry</text>
      <text class="stage-body" x="26" y="140">Resolve agent key</text>
      <text class="stage-code mono" x="26" y="162">0x59b1...496c</text>
    </g>

    <g transform="translate(802 34)">
      <rect x="0" y="0" width="196" height="176" rx="22" class="card stage-4"/>
      <circle class="icon-ring" cx="38" cy="38" r="21"/>
      <path class="icon" d="M28 38h20M38 28v20M30 30l16 16M46 30L30 46"/>
      <text class="stage-num" x="26" y="80">04</text>
      <text class="stage-title" x="26" y="112">Verify</text>
      <text class="stage-body" x="26" y="140">Match all fields</text>
      <text class="stage-code mono" x="26" y="162">local check</text>
    </g>

    <g transform="translate(1054 34)">
      <rect x="0" y="0" width="196" height="176" rx="22" class="card card-final stage-5"/>
      <circle class="icon-ring" cx="38" cy="38" r="21"/>
      <path class="icon icon-ok" d="M28 39l8 8 18-22"/>
      <text class="stage-num" x="26" y="80">05</text>
      <text class="stage-title" x="26" y="112">Execute</text>
      <text class="stage-body" x="26" y="140">Release transaction</text>
      <text class="stage-code mono ok" x="26" y="162">approved</text>
    </g>
  </g>

  <g transform="translate(72 742)">
    <g>
      <rect x="0" y="0" width="300" height="96" rx="22" class="evidence-card"/>
      <text class="evidence-label" x="24" y="34">SIGNED VALUES</text>
      <text class="evidence-title" x="24" y="62">Intent payload</text>
      <text class="evidence-value mono" x="24" y="82">amount, receiver, policy, nonce</text>
    </g>
    <g transform="translate(332 0)">
      <rect x="0" y="0" width="300" height="96" rx="22" class="evidence-card"/>
      <text class="evidence-label" x="24" y="34">POST-QUANTUM PROOF</text>
      <text class="evidence-title" x="24" y="62">ML-DSA signature</text>
      <text class="evidence-value mono" x="24" y="82">hash 0x6f91...e42b</text>
    </g>
    <g transform="translate(664 0)">
      <rect x="0" y="0" width="300" height="96" rx="22" class="evidence-card"/>
      <text class="evidence-label" x="24" y="34">BASE REGISTRY</text>
      <text class="evidence-title" x="24" y="62">Agent key hash</text>
      <text class="evidence-value mono" x="24" y="82">anchor 0x59b1...496c</text>
    </g>
    <g transform="translate(996 0)">
      <rect x="0" y="0" width="300" height="96" rx="22" class="evidence-card"/>
      <text class="evidence-label" x="24" y="34">RESULT</text>
      <text class="evidence-title" x="24" y="62">Tamper rejected</text>
      <text class="evidence-value mono ok" x="24" y="82">matching values required</text>
    </g>
  </g>
</svg>
