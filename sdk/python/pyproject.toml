[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cevex"
version = "0.1.0"
description = "Official Python SDK for the CEVEX post-quantum identity protocol"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "CEVEX Protocol", email = "contact@cevex.io" }]
requires-python = ">=3.10"
keywords = [
    "post-quantum",
    "cryptography",
    "dilithium",
    "falcon",
    "identity",
    "agents",
    "base",
    "blockchain",
    "pqc",
    "lattice",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "web3>=6.0.0",
    "eth-account>=0.10.0",
    "httpx>=0.27.0",
    "pycryptodome>=3.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://cevex.io"
Repository = "https://github.com/cevex/cevex-sdk"
Documentation = "https://github.com/cevex/cevex-sdk/tree/main/docs"
Issues = "https://github.com/cevex/cevex-sdk/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
